<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 480px; height: 280px;
      background: #2c2420;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #f0ebe0;
      user-select: none;
      overflow: hidden;
    }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 6px; }
    .sub { font-size: 12px; color: #a09283; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 40px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: #b87333;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    .status { margin-top: 18px; font-size: 12px; color: #8b6f4e; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>PostValidation Service</h1>
  <p class="sub">Powered by Mythics</p>
  <div class="spinner"></div>
  <p class="status">Starting backend...</p>
</body>
</html>
