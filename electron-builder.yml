appId: com.mythics.postvalidation
productName: PostValidation Service
copyright: Copyright (c) 2024 Mythics

directories:
  output: release

files:
  - electron/**/*
  - frontend/build/**/*
  - package.json
  # 1. Map the compiled backend explicitly into the app
  - from: dist/backend
    to: backend

asarUnpack:
  # 2. Tell electron-builder to unpack the backend folder from the ASAR
  - backend/**/*

extraResources:
  - from: assets/icon.ico
    to: icon.ico

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  shortcutName: PostValidation Service
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true

portable:
  artifactName: PostValidation-${version}-portable.exe